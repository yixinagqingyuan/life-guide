# 宿主界面展示的信息；检索算法和回答规则分别在 scripts/ 与 SKILL.md。
interface:
  # 用户在技能列表中看到的名称和简短说明。
  display_name: "高性价比人生指南"
  short_description: "回答问题后，附上本地《高性价比人生指南》的相关原标题、章节及成本收益标签"
  # 点击调用时使用的提示词；$life-guide 显式指定要加载的技能。
  default_prompt: "请用 $life-guide 正常回答我接下来的问题，每次答复结尾以‘高性价比人生指南提醒：’为标题，展示相关条目的‘原标题——《章节名》’，另加‘性价比：’列出原文的金钱成本、时间成本、毅力成本和收益量级及口径，不加章节条号或原文链接。"
policy:
  # 允许宿主按任务自动选择此技能；不保证每个新会话都自动加载。
  allow_implicit_invocation: true
