# 宿主界面展示的信息；检索算法和回答规则分别在 scripts/ 与 SKILL.md。
interface:
  # 用户在技能列表中看到的名称和简短说明。
  display_name: "高性价比人生指南"
  short_description: "先回答你的问题，再从本地《高性价比人生指南》摘录相关原话，以破折号和章节名署出处"
  # 点击调用时使用的提示词；$life-guide 显式指定要加载的技能。
  default_prompt: "请用 $life-guide 正常回答我接下来的问题，每次答复结尾以‘高性价比人生指南提醒：’为标题，以‘原文句子——《章节名》’展示相关的《高性价比人生指南》原话，不加标签、章节条号或原文链接。"
policy:
  # 允许宿主按任务自动选择此技能；不保证每个新会话都自动加载。
  allow_implicit_invocation: true
